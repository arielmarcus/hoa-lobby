<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>קרן היסוד 5</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@200;300;400;600;700;900&display=swap" rel="stylesheet">
  <script>
    // Cache-bust style.css for the same reason as app.js below — otherwise the
    // WebView can keep serving an old stylesheet after a deploy.
    document.write('<link rel="stylesheet" href="style.css?v=' + Date.now() + '">');
  </script>
</head>
<body>
  <div id="app">

    <!-- Header -->
    <header id="header">
      <div id="header-start">
        <div id="clock"></div>
        <div id="dates">
          <div id="gregorian-date"></div>
          <div id="hebrew-date"></div>
        </div>
      </div>
      <div id="building-name">
        <div id="welcome-text">ברוכים הבאים ל</div>
        <div id="building-title">קרן היסוד 5</div>
      </div>
      <div id="header-end">
        <div id="weather-mini">
          <span id="weather-icon-mini"></span>
          <span id="weather-temp-mini"></span>
        </div>
        <div id="weather-desc-mini"></div>
      </div>
    </header>

    <!-- Main 3-column layout (RTL: right=col1, center=col2, left=col3) -->
    <main id="main">

      <!-- Col 1 (visual right): Shabbat + Announcements -->
      <aside id="sidebar">
        <div class="panel" id="shabbat-panel">
          <div class="panel-title">זמני שבת</div>
          <div id="shabbat-content"><span class="loading">טוען…</span></div>
        </div>
        <div class="panel" id="announcements-panel">
          <div class="panel-title">הודעות לדיירים</div>
          <div id="announcements-content"><span class="loading">טוען…</span></div>
        </div>
      </aside>

      <!-- Col 2 (center): Rotating image -->
      <div id="image-panel">
        <div id="bg-image"></div>
        <div id="image-overlay"></div>
      </div>

      <!-- Col 3 (visual left): News headlines -->
      <div id="news-panel">
        <div class="panel-title">חדשות</div>
        <div id="news-list"></div>
      </div>

    </main>

    <!-- News ticker -->
    <footer id="ticker-bar">
      <div id="ticker-label">חדשות</div>
      <div id="ticker-wrapper">
        <div id="ticker-content"></div>
      </div>
    </footer>

    <!-- Shabbat mode full-screen overlay -->
    <div id="shabbat-overlay">
      <div id="shabbat-overlay-top">
        <div id="shabbat-shalom-banner">שבת שלום ✨</div>
        <div id="shabbat-overlay-parasha"></div>
      </div>
      <div id="shabbat-overlay-clock"></div>
      <div id="shabbat-overlay-date"></div>
      <div id="shabbat-overlay-weather"></div>
      <div id="shabbat-overlay-times">
        <div class="shabbat-overlay-row">
          <span class="shabbat-overlay-label" id="shabbat-candle-label">🕯️ הדלקת נרות</span>
          <span class="shabbat-overlay-time" id="shabbat-candle-time"></span>
        </div>
        <div class="shabbat-overlay-row">
          <span class="shabbat-overlay-label" id="shabbat-havdalah-label">✨ הבדלה</span>
          <span class="shabbat-overlay-time" id="shabbat-havdalah-time"></span>
        </div>
      </div>
    </div>

  </div>
  <script>
    // Fit the 1920×1080 canvas with syntax old Chrome can run. This has to live
    // here, not only in app.js: if app.js fails to parse, nothing else scales
    // the page and the TV shows a clipped blank corner.
    function scaleToFit() {
      var vv = window.visualViewport;
      var w = (vv && vv.width) || window.innerWidth || document.documentElement.clientWidth;
      var h = (vv && vv.height) || window.innerHeight || document.documentElement.clientHeight;
      if (!w || !h) return;
      var scale = Math.min(w / 1920, h / 1080);
      var app = document.getElementById('app');
      if (!app) return;
      var x = (w - 1920 * scale) / 2 + (vv ? vv.offsetLeft || 0 : 0);
      var y = (h - 1080 * scale) / 2 + (vv ? vv.offsetTop || 0 : 0);
      app.style.transform = 'scale(' + scale + ')';
      app.style.left = x + 'px';
      app.style.top = y + 'px';
    }
    scaleToFit();
    window.addEventListener('resize', scaleToFit);
    window.addEventListener('orientationchange', scaleToFit);
    window.addEventListener('load', scaleToFit);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', scaleToFit);
    setTimeout(scaleToFit, 300);
    setTimeout(scaleToFit, 1000);
  </script>
  <script>
    // Cache-bust on every load — a bare <script src="app.js"> lets a WebView
    // (like Fully Kiosk Browser's) cache app.js indefinitely and never see updates.
    document.write('<script src="app.js?v=' + Date.now() + '"><\/script>');
  </script>
</body>
</html>
